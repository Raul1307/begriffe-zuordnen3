<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Begriffe zuordnen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 30px;
            color: #333;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .dropzone {
            background-color: #fff;
            border: 2px dashed #999;
            border-radius: 10px;
            width: 200px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .dropzone h2 {
            margin-top: 0;
            font-size: 18px;
            color: #555;
        }
        .item {
            background-color: #4f46e5;
            color: white;
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 5px;
            cursor: grab;
            user-select: none;
            transition: transform 0.2s;
        }
        .item.dragging {
            opacity: 0.6;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <h1>Ordne die Begriffe zu!</h1>
    <div class="container">
        <div class="dropzone" id="maschinennah">
            <h2>Maschinennächsten</h2>
        </div>
        <div class="dropzone" id="menschennah">
            <h2>Menschennächsten</h2>
        </div>
    </div>

    <div class="container" style="margin-top: 50px;">
        <div class="item" draggable="true" data-answer="maschinennah">Maschinensprache</div>
        <div class="item" draggable="true" data-answer="maschinennah">Assembler</div>
        <div class="item" draggable="true" data-answer="menschennah">Hochsprache (z. B. C, Java)</div>
    </div>

    <script>
        const items = document.querySelectorAll('.item');
        const dropzones = document.querySelectorAll('.dropzone');

        let draggedItem = null;

        items.forEach(item => {
            item.addEventListener('dragstart', () => {
                draggedItem = item;
                setTimeout(() => {
                    item.classList.add('dragging');
                }, 0);
            });

            item.addEventListener('dragend', () => {
                draggedItem = null;
                item.classList.remove('dragging');
            });
        });

        dropzones.forEach(zone => {
            zone.addEventListener('dragover', e => e.preventDefault());

            zone.addEventListener('drop', () => {
                const correct = draggedItem.getAttribute('data-answer') === zone.id;
                if (correct) {
                    zone.appendChild(draggedItem);
                    draggedItem.style.backgroundColor = '#16a34a'; // grün
                    setTimeout(() => draggedItem.remove(), 500); // verschwindet nach 0.5s
                } else {
                    draggedItem.style.backgroundColor = '#dc2626'; // rot
                    // bleibt im Container
                }
            });
        });
    </script>
</body>
</html>
